name: Build and Release

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build (defaults to the one that owns the workflow)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: opss-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.bump.outputs.name }}
      version_code: ${{ steps.bump.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      # The version has to be raised *before* Gradle runs, otherwise the APK
      # is built with the previous versionCode while the release tag carries the
      # next one. This edit stays in the workspace only; the commit happens in the
      # release job, which is the one holding write access.
      - name: Reserve the next version
        id: bump
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle
          CURRENT_NAME=$(grep -oP 'versionName\s+"\K[^"]+' "$GRADLE" | head -1 | tr -d ' ')
          CURRENT_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' "$GRADLE" | head -1)

          MAJ=$(echo "$CURRENT_NAME" | cut -d. -f1)
          MIN=$(echo "$CURRENT_NAME" | cut -d. -f2)
          PAT=$(echo "$CURRENT_NAME" | cut -d. -f3); PAT=${PAT:-0}
          NEXT="$MAJ.$MIN.$((PAT + 1))"
          NEXT_CODE=$((CURRENT_CODE + 1))

          echo "current: $CURRENT_NAME (code $CURRENT_CODE) -> next: $NEXT (code $NEXT_CODE)"
          sed -i -E "s/(versionName\s+\")[^\"]+(\")/\1$NEXT\2/" "$GRADLE"
          sed -i -E "s/(versionCode\s+)[0-9]+/\1$NEXT_CODE/" "$GRADLE"
          grep -nE 'versionName|versionCode' "$GRADLE" | head -2

          echo "name=$NEXT" >> "$GITHUB_OUTPUT"
          echo "code=$NEXT_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17 for the SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          # sdkmanager is compiled for Java 17, so it must not run under the
          # JDK 11 that Gradle needs.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          NDK=$(grep -oP "ndkVersion\s+'\K[^']+" app/build.gradle | head -1 || true)
          if [ -n "${NDK:-}" ]; then
            echo "Installing ndk;$NDK"
            for attempt in 1 2 3; do
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" 2>&1 | tail -3 || true
              if [ -d "$ANDROID_HOME/ndk/$NDK" ]; then
                echo "NDK $NDK installed"; break
              fi
              echo "install attempt $attempt failed"
              sleep 10
            done
          fi

          echo "NDK present:"; ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          if [ -n "${NDK:-}" ] && [ ! -d "$ANDROID_HOME/ndk/$NDK" ]; then
            echo "::error::NDK $NDK could not be installed; image ships: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # app/libs/projectlibfile.aar bundles okhttp 3.8.1 inside its own
      # classes.jar. An aar from fileTree is unpacked straight onto the
      # classpath, so a dependency exclude cannot drop those classes and the
      # pinned okhttp 3.12.13 in build.gradle then fails the duplicate-class
      # check. The bundled 3.8.1 also predates
      # OkHttpClient$Builder.callTimeout, which Firebase Crashlytics calls, so
      # leaving it in place throws NoSuchMethodError at startup.
      #
      # Removing okhttp3 from the aar's classes.jar here, in the build job,
      # leaves exactly one okhttp on the classpath. This edits the workspace
      # only; nothing is written back to the repository.
      - name: Drop the okhttp bundled inside the vendored aars
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          for AAR in app/libs/*.aar; do
            NAME=$(basename "$AAR" .aar)
            mkdir -p "$WORK/$NAME"
            unzip -o -q "$AAR" -d "$WORK/$NAME"
            [ -f "$WORK/$NAME/classes.jar" ] || continue

            COUNT=$(unzip -l "$WORK/$NAME/classes.jar" | grep -c 'okhttp3/' || true)
            echo "$NAME: $COUNT okhttp3 entries bundled"
            [ "${COUNT:-0}" -gt 0 ] || continue

            # Rebuild classes.jar from every package except okhttp3.
            mkdir -p "$WORK/$NAME/x"
            unzip -o -q "$WORK/$NAME/classes.jar" -d "$WORK/$NAME/x"
            find "$WORK/$NAME/x" -type d -name okhttp3 -prune -exec rm -rf {} +
            LEFT=$(find "$WORK/$NAME/x" -name '*.class' | wc -l)
            echo "$NAME: keeping $LEFT classes, dropping okhttp3"

            rm -f "$WORK/$NAME/classes.jar"
            (cd "$WORK/$NAME/x" && zip -q -r "../classes.jar" .)
            # Put the trimmed jar back into the aar.
            rm -f "$AAR"
            (cd "$WORK/$NAME" && zip -q -r "$GITHUB_WORKSPACE/$AAR" .)
          done
          rm -rf "$WORK"
          echo "--- libs after ---"
          ls -la app/libs/

      - name: Build prod debug APK
        run: |
          set -euo pipefail
          # The vendor zip lost the executable bit on gradlew.
          chmod +x gradlew
          # Skip configuration-time work we do not need and keep the daemon off
          # so a failed build does not leak a JVM into the next step.
          ./gradlew assembleProdDebug --no-daemon --stacktrace \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.caching=true

      # The Gradle caching action's own cleanup step runs after the job and uses
      # whatever JDK is current. Left on 11 it aborts with "Gradle requires JVM
      # 17", which loses the build cache and makes every later build slower.
      - name: Hand JDK 17 back to the post-build steps
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      - name: Collect APK and read its badging
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "ERROR: no APK produced"; exit 1; }

          NAME=${{ steps.bump.outputs.name }}
          test -n "$NAME" || { echo "ERROR: version not resolved"; exit 1; }
          cp "$APK" "dist/opss-${{ vars.APP_SLUG || 'passenger' }}-$NAME.apk"
          ls -la dist

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          echo "--- unzip integrity ---"
          unzip -t "dist/"*.apk | tail -2

          echo "--- signature ---"
          # Find apksigner wherever this image actually put build-tools.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          echo "using $APKSIGNER"
          # An unsigned APK cannot be parsed by Android, so this must fail the
          # build rather than quietly shipping an uninstallable file.
          "$APKSIGNER" verify --print-certs --verbose "dist/"*.apk || \
            { echo "::error::the APK is not correctly signed"; exit 1; }

          echo "--- badging ---"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort | tail -1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "dist/"*.apk | \
              grep -E "^package|sdkVersion|targetSdkVersion|uses-permission|native-code|application-label" || true
          else
            echo "aapt not available; skipping badging"
          fi
          unzip -l "dist/"*.apk | grep "lib/" | awk -F/ '{print $2}' | sort -u

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opss-${{ vars.APP_SLUG || 'passenger' }}-${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 30

      - name: Write step summary
        run: |
          {
            echo "### Build summary"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- APK: \`opss-${{ vars.APP_SLUG || 'passenger' }}-${{ steps.apk.outputs.name }}.apk\`"
            echo "- APK size: $(du -h dist/*.apk | cut -f1)"
            echo "- ABIs: $(unzip -l dist/*.apk | grep -o 'lib/[a-z0-9_-]*' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Bump version and publish release
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Needed so the release job can download the APK artifact this run produced.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java for the release tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Commit the version the APK was actually built with
        run: |
          set -euo pipefail
          NAME="${{ needs.build.outputs.version_name }}"
          CODE="${{ needs.build.outputs.version_code }}"
          test -n "$NAME" || { echo "ERROR: the build job did not report a version"; exit 1; }

          GRADLE=app/build.gradle
          sed -i -E "s/(versionName\s+\")[^\"]+(\")/\1$NAME\2/" "$GRADLE"
          sed -i -E "s/(versionCode\s+)[0-9]+/\1$CODE/" "$GRADLE"
          grep -nE 'versionName|versionCode' "$GRADLE" | head -2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE"
          git commit -m "chore(release): bump to $NAME (versionCode $CODE) [skip ci]"
          git push origin HEAD:main

      - name: Download the APK from this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for attempt in 1 2 3; do
            if gh run download "${{ github.run_id }}" -D dist \
                 --pattern "opss-${{ vars.APP_SLUG || 'passenger' }}-*" 2>/dev/null; then
              break
            fi
            echo "download attempt $attempt failed, retrying"
            sleep 15
          done
          APK=$(find dist -name '*.apk' | head -1)
          test -n "$APK" || { echo "ERROR: APK not found in the run artifacts"; exit 1; }
          echo "APK: $APK"

      - name: Publish the APK to the matching release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          APK=$(find dist -name '*.apk' | head -1)
          test -n "$APK" || { echo "ERROR: no APK to publish"; exit 1; }

          NAME="opss-${{ vars.APP_SLUG || 'passenger' }}-$VERSION.apk"

          # A debug build is signed with the throwaway Android debug key, so it
          # will not install over an existing build signed with the vendor key.
          # Document that on the release page instead of failing silently.
          {
            echo "**Version $VERSION** (versionCode ${{ needs.build.outputs.version_code }})"
            echo ""
            echo "> **Install note:** this is a *debug* build, signed with the standard"
            echo "> Android debug key. If it will not install on your phone, uninstall the"
            echo "> previously installed copy first — Android refuses to replace an app"
            echo "> signed with a different key. Debug builds also point at a placeholder"
            echo "> Firebase project, so login and push will not work yet."
            echo ""
            echo "Runtime behaviour is verified separately by the"
            echo "`Verify install on a real device image` workflow."
            echo ""
            echo "### What changed and why"
            echo ""
            git log "${{ github.event.before }}..${{ github.sha }}" --pretty='- %s (%h)' | head -30 || echo "- (initial)"
            echo ""
            echo "---"
            echo "Built from \`main\` at \`${{ github.sha }}\`."
          } > notes.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "opss ${{ vars.APP_SLUG || 'passenger' }} $TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$APK" --title "opss ${{ vars.APP_SLUG || 'passenger' }} $TAG" --notes-file notes.md
          fi
          echo "https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Summary
        run: |
          {
            echo "### Release published"
            echo ""
            echo "- Tag: \`v${{ needs.build.outputs.version_name }}\`"
            echo "- Asset: \`opss-${{ vars.APP_SLUG || 'passenger' }}-${{ needs.build.outputs.version_name }}.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"