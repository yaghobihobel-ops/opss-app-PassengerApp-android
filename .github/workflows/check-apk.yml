name: Check the APK manifest

# The install kept failing with INSTALL_PARSE_FAILED_MANIFEST_MALFORMED naming
# com.alaadcin.user.MyFirebaseMessagingService, even though the source manifest
# declares android:exported on it. This job reads the *built* APK and reports
# what is actually inside it, so the next decision is based on the binary rather
# than on the source file.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/check-apk.yml'

permissions:
  contents: read

jobs:
  check:
    name: Report the built manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve which release to test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # `/releases/latest` is the most recently published release, not the
          # highest version, so a rebuild landing on an older tag would never be
          # tested. Pick the highest vN.N.N, comparing the numeric triple because
          # v0.0.9 sorts after v0.0.10 as a string. Parsed with python because
          # jq is not installed on every runner image.
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -o releases.json
          cat > resolve_apk.py <<'PYEOF'
          import json
          import sys

          # Choose the highest released version that actually carries an APK.
          #
          # `/releases/latest` returns the most recently published release, not the
          # highest version, so a rebuild landing on an older tag stays invisible to every
          # workflow that downloads from it. Compare the numeric triple rather than the
          # tag string, because v0.0.9 sorts after v0.0.10 alphabetically.
          #
          # Exits non-zero on an API error or when nothing is published, so an empty URL
          # is never mistaken for "no releases". Parsed with python because jq is not
          # installed on every runner image.
          with open("releases.json", encoding="utf-8") as fh:
              rels = json.load(fh)

          if isinstance(rels, dict):
              sys.exit("releases API returned an error: " + json.dumps(rels)[:300])

          best = None
          for r in rels:
              if r.get("draft"):
                  continue
              url = next(
                  (a["browser_download_url"] for a in r.get("assets", []) if a["name"].endswith(".apk")),
                  None,
              )
              if not url:
                  continue
              try:
                  key = [int(part) for part in r["tag_name"].lstrip("v").split(".")]
              except (ValueError, KeyError):
                  continue
              if best is None or key > best[0]:
                  best = (key, url)

          if best is None:
              sys.exit("no published release carries an APK")

          print(best[1])
          PYEOF
          python3 resolve_apk.py > apk-url.txt
          echo "testing: $(cat apk-url.txt 2>/dev/null || echo none)"
          test -s apk-url.txt || { echo "::error::could not resolve a release URL"; exit 1; }

      - name: Read every component and its exported flag
        run: |
          set -uo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump xmltree dist/app.apk AndroidManifest.xml > dist/manifest-tree.txt 2>&1
          head -3 dist/manifest-tree.txt
          grep -q "E: manifest" dist/manifest-tree.txt || { echo "::error::could not read the manifest"; exit 1; }

          # Print each service/activity/receiver together with its exported value,
          # so a missing attribute is visible next to the component that needs it.
          awk '
            /E: (service|activity|receiver|provider) / { comp = $0; exported = "NOT-SET"; next }
            /android:exported/ { exported = $0; print comp; print "    " exported; next }
          ' dist/manifest-tree.txt > dist/components.txt

          echo "--- components that declare an intent-filter ---"
          awk '
            /E: (service|activity|receiver|provider) / { keep = 0; comp = $0; next }
            /E: intent-filter / { keep = 1; print comp; next }
          ' dist/manifest-tree.txt | head -20

          echo ""
          echo "--- the Firebase messaging service specifically ---"
          grep -B2 -A12 "MyFirebaseMessagingService" dist/manifest-tree.txt | head -30

          echo ""
          echo "--- exported attributes present in the binary ---"
          grep -c "android:exported" dist/manifest-tree.txt || echo 0

      - name: Put the report in the summary
        run: |
          {
            echo "### Built APK manifest"
            echo ""
            echo "APK sha256: \`$(cat dist/app.apk.sha256 | cut -d' ' -f1)\`"
            echo ""
            echo "#### components with an intent-filter"
            echo '```'
            awk '/E: (service|activity|receiver|provider) /{c=$0} /E: intent-filter/{print c}' dist/manifest-tree.txt
            echo '```'
            echo ""
            echo "#### MyFirebaseMessagingService"
            echo '```'
            grep -A12 "MyFirebaseMessagingService" dist/manifest-tree.txt | head -14
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-manifest-report
          path: |
            dist/manifest-tree.txt
            dist/components.txt
          retention-days: 30
          if-no-files-found: warn