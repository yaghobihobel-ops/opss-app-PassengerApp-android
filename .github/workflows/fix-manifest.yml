name: Add Explicit AppComponentFactory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Give appComponentFactory an explicit value
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          import xml.etree.ElementTree as ET

          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          start = s.find("<application")
          end = s.index(">", start)
          tag = s[start:end + 1]

          # The merger rejects tools:replace="...appComponentFactory" unless the
          # attribute itself carries a value in this manifest. Check for a real
          # android:appComponentFactory="..." assignment, not a mention inside
          # the tools:replace list.
          has_attr = re.search(r'android:appComponentFactory\s*=\s*"', tag) is not None

          if has_attr:
              print("appComponentFactory already declared on <application>")
          else:
              insert_at = tag.index(">")
              new_tag = (tag[:insert_at].rstrip() +
                         '\n        android:appComponentFactory="androidx.core.app.CoreComponentFactory">')
              s = s[:start] + new_tag + s[end + 1:]
              p.write_text(s, encoding="utf-8")
              print("added android:appComponentFactory")

          ET.fromstring(p.read_text(encoding="utf-8"))
          print("manifest parses cleanly")
          PY

          echo "--- resulting application tag ---"
          awk '/<application/,/\>/' app/src/main/AndroidManifest.xml | grep -E "application|appComponentFactory|tools:replace"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml
          git diff --cached --quiet || git commit -m "fix(manifest): declare appComponentFactory explicitly for the merger"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.event.repository.default_branch }} 2>/dev/null; then
              echo "pushed"; break
            fi
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done