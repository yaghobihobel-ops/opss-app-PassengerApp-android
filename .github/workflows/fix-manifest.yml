name: Merge Duplicate Manifest Attributes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge tools:replace declarations on <application>
        run: |
          set -euo pipefail
          echo "--- before ---"
          awk '/<application/,/\>/' app/src/main/AndroidManifest.xml | head -16

          python3 - <<'PY'
          import pathlib, re
          import xml.etree.ElementTree as ET

          p = pathlib.Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          start = s.find("<application")
          if start == -1:
              raise SystemExit("no <application> tag")
          end = s.index(">", start)
          tag = s[start:end + 1]

          values, seen = [], set()
          for v in re.findall(r'tools:replace="([^"]*)"', tag):
              for part in v.split(","):
                  part = part.strip()
                  if part and part not in seen:
                      seen.add(part)
                      values.append(part)

          occurrences = len(re.findall(r'tools:replace="[^"]*"', tag))
          print("declarations:", occurrences, "unique values:", values)

          if occurrences != 1:
              merged = "tools:replace=\"" + ",".join(values) + "\""
              stripped = re.sub(r'\s*tools:replace="[^"]*"', "", tag)
              at = stripped.index(">")
              new_tag = stripped[:at].rstrip() + "\n        " + merged + ">"
              s = s[:start] + new_tag + s[end + 1:]
              p.write_text(s, encoding="utf-8")
              print("merged into a single attribute")
          else:
              print("already a single declaration")

          ET.fromstring(p.read_text(encoding="utf-8"))
          print("AndroidManifest.xml parses cleanly")
          PY

          echo "--- after ---"
          grep -n "tools:replace" app/src/main/AndroidManifest.xml

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml
          git diff --cached --quiet || git commit -m "fix(manifest): merge duplicate tools:replace declarations"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.event.repository.default_branch }} 2>/dev/null; then
              echo "pushed"; break
            fi
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done