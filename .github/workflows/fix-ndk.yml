name: Drop Unavailable NDK Pin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove the NDK pin entirely
        run: |
          set -euo pipefail
          echo "--- native sources present? ---"
          find app/src -name "*.cpp" -o -name "*.c" -o -name "CMakeLists.txt" | head -5 || true
          find app/src -name "*.cpp" | grep -q . && HAS_NATIVE=1 || HAS_NATIVE=0
          echo "HAS_NATIVE=$HAS_NATIVE"
          echo "--- jniLibs ---"
          ls app/src/main/jniLibs 2>/dev/null || echo "(none)"

          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # The app ships prebuilt .so files only and compiles no native code,
          # yet it pins a 2020 NDK that no runner image carries. Drop the pin
          # and let AGP use whatever NDK the image provides.
          before = s
          s = re.sub(r"^[ \t]*ndkVersion\s+'[^']+'\n", "", s, flags=re.M)
          if s != before:
              p.write_text(s, encoding="utf-8")
              print("removed the ndkVersion pin")
          else:
              print("no ndkVersion pin found")
          PY

          grep -n "ndkVersion" app/build.gradle || echo "(ndkVersion no longer declared)"

      - name: Show what the runner actually offers
        run: |
          ls "$ANDROID_HOME/ndk" || echo "(no NDKs in the image)"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git diff --cached --quiet || git commit -m "fix(gradle): drop the unavailable NDK pin"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.event.repository.default_branch }} 2>/dev/null; then
              echo "pushed"; break
            fi
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done