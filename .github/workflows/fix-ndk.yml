name: Install NDK 22 For CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the NDK 22 pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # The prebuilt .so files in jniLibs are old binaries; stripping their
          # debug symbols needs the matching NDK toolchain layout. NDK 22 is the
          # last release that still ships the legacy arm-linux-androideabi path,
          # so pin it back and let CI install exactly that revision.
          if "ndkVersion" not in s:
              s = s.replace("    renderscriptSupportModeEnabled true",
                            "    renderscriptSupportModeEnabled true\n    ndkVersion '22.0.7026061'")
              p.write_text(s, encoding="utf-8")
              print("restored ndkVersion '22.0.7026061'")
          else:
              print("ndkVersion already declared")
          PY
          grep -n "ndkVersion" app/build.gradle

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git diff --cached --quiet || git commit -m "fix(gradle): pin NDK 22, the last release with the legacy ABI toolchain"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.event.repository.default_branch }} 2>/dev/null; then
              echo "pushed"; break
            fi
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done