name: Install Required NDK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install the NDK the build script asks for
        run: |
          set -euo pipefail
          WANTED=$(grep -oP "ndkVersion\s+'\K[^']+" app/build.gradle | head -1)
          echo "build.gradle wants NDK: $WANTED"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$WANTED" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/ndk" || echo "(not installed)"

      - name: Pin ndkVersion to something the runner actually has
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"ndkVersion\s+'([^']+)'", s)
          old = m.group(1) if m else None
          print("declared ndkVersion:", old)

          # The runner image ships a newer NDK; the pinned 2020 build is not
          # published for every platform and AGP refuses to fall back.
          new = "25.1.8937393"
          if old and old != new:
              s = re.sub(r"ndkVersion\s+'[^']+'", f"ndkVersion '{new}'", s)
              p.write_text(s, encoding="utf-8")
              print(f"ndkVersion {old} -> {new}")
          else:
              print("already on the runner's NDK")
          PY
          grep -n "ndkVersion" app/build.gradle || echo "(no ndkVersion declared — AGP will use its default)"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git diff --cached --quiet || git commit -m "fix(gradle): pin ndkVersion to an NDK available on CI runners"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.event.repository.default_branch }} 2>/dev/null; then
              echo "pushed"; break
            fi
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
            [ "$attempt" = "3" ] && echo "::warning::push did not land"
          done