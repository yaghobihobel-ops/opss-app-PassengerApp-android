name: Fix Gradle Signing And JVM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Make the signing config portable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          # Swallow the vendor block from the keystore probe up to compileOptions.
          pat = re.compile(
              r"[ \t]*def releaseKeystore = file\('[^']*'\)\n"
              r".*?"
              r"(?=[ \t]*compileOptions \{)",
              re.S)

          m = pat.search(s)
          if not m:
              raise SystemExit("ERROR: signing block not found")

          new_block = (
              "    // The vendor keystore lives on a Windows machine that is not present\n"
              "    // here, and file() on a Windows path throws URISyntaxException on the\n"
              "    // Linux runner. Probe portably and fall back to the Android debug key.\n"
              "    def releaseKeystoreFile = {\n"
              "        def win = new File('C:/Users/sitw2/Documents/okboz.jks')\n"
              "        def nix = new File('/opt/opss/okboz.jks')\n"
              "        if (win.exists()) return win\n"
              "        if (nix.exists()) return nix\n"
              "        return null\n"
              "    }()\n"
              "    signingConfigs {\n"
              "        if (releaseKeystoreFile != null) {\n"
              "            config {\n"
              "                keyAlias 'okboz.com'\n"
              "                keyPassword 'okboz.com'\n"
              "                storeFile releaseKeystoreFile\n"
              "                storePassword 'okboz.com'\n"
              "            }\n"
              "        }\n"
              "    }\n"
          )

          s = s[:m.start()] + new_block + s[m.end():]
          # Older revisions referenced the old variable name; catch every variant.
          s = re.sub(r"signingConfig\s+(?:signingConfigs\.config"
                     r"|releaseKeystore\.exists\(\)\s*\?\s*signingConfigs\.config\s*:\s*null)",
                     "signingConfig releaseKeystoreFile != null ? signingConfigs.config : null", s)
          p.write_text(s, encoding="utf-8")
          print("signing block rewritten")
          PY
          echo "--- resulting block ---"
          sed -n '10,32p' app/build.gradle
          echo "--- signingConfig references ---"
          grep -n "signingConfig " app/build.gradle

      - name: Drop JVM flags that no longer exist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("gradle.properties")
          s = p.read_text(encoding="utf-8")
          p.write_text(re.sub(r"-XX:MaxPermSize=\d+[MmGg]?\s*", "", s), encoding="utf-8")
          print("patched gradle.properties")
          PY
          grep -E "^org.gradle.jvmargs" gradle.properties

      - name: Verify the build script parses
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew help --no-daemon > /tmp/help.log 2>&1 || {
            echo "configure failed, tail of log:"; tail -40 /tmp/help.log; exit 1;
          }
          echo "build script parses cleanly"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle gradle.properties
          git diff --cached --quiet || git commit -m "fix(gradle): make signing config portable and drop removed JVM flags"
          # Other workflows may have pushed since checkout; rebase before pushing.
          git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}" || true
          git push origin HEAD:${{ github.event.repository.default_branch }}