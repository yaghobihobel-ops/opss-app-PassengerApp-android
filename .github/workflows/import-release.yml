name: Import Source From Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag that holds the source zip'
        required: true
        default: 'opss-app-PassengerApp-android-org'
      asset_name:
        description: 'Asset file name inside that release'
        required: true
        default: 'PassengerApp.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Download source zip from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/src
          gh release download "$TAG" --pattern "$ASSET" --dir /tmp/src
          ls -la /tmp/src

      - name: Unzip and flatten into repository root
        run: |
          set -euo pipefail
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          unzip -q /tmp/src/*.zip -d /tmp/unpack

          # The zip nests the Gradle project one or more levels deep.
          # Walk down until we find the directory that owns build.gradle + gradlew.
          ROOT=$(find /tmp/unpack -type f -name gradlew -printf '%h\n' | head -1)
          if [ -z "$ROOT" ]; then
            echo "ERROR: no gradlew found in the uploaded zip"; exit 1
          fi
          echo "Gradle project root inside zip: $ROOT"
          ls -la "$ROOT" | head -20

          # Flatten: replace the working tree with the project contents so the
          # repo root itself becomes the Gradle root (no extra wrapper folder).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$ROOT"/. .

          echo "--- repository root after flatten ---"
          ls -la
          test -f build.gradle || { echo "ERROR: build.gradle missing after flatten"; exit 1; }
          test -f settings.gradle || { echo "ERROR: settings.gradle missing after flatten"; exit 1; }

      - name: Strip build artifacts and local config
        run: |
          set -euo pipefail
          rm -rf .gradle build app/build local.properties .idea
          rm -f app/prod/release/output.json
          find . -name '*.iml' -delete
          find . -name '.DS_Store' -delete
          mkdir -p .github/workflows

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."; exit 0
          fi
          git commit -m "chore: import Android source from release asset ${{ inputs.asset_name }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Summary
        run: |
          {
            echo "### Source imported"
            echo ""
            echo "- Asset: \`${{ inputs.asset_name }}\`"
            echo "- Files: $(git ls-files | wc -l)"
            echo "- Commit: $(git rev-parse --short HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"