name: Prepare Project For CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Restore Gradle wrapper (missing from the vendor zip)
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'gradle-\K[0-9.]+(?=-all\.zip)' gradle/wrapper/gradle-wrapper.properties)
          echo "Gradle version needed: $VERSION"

          cd /tmp
          curl -fsSL -o gradle-dist.zip "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"
          unzip -q gradle-dist.zip
          # Generate the official wrapper in a scratch dir so nothing in the
          # Android build is evaluated while doing it.
          mkdir -p /tmp/wrap && cd /tmp/wrap
          "/tmp/gradle-${VERSION}/bin/gradle" wrapper --gradle-version "$VERSION" --quiet

          cd "$GITHUB_WORKSPACE"
          cp /tmp/wrap/gradlew /tmp/wrap/gradlew.bat .
          cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          chmod +x gradlew
          ls -la gradle/wrapper/ gradlew

      - name: Apply Gradle fixes needed for a modern CI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib

          ALIYUN = "maven { url 'https://maven.aliyun.com/repository/jcenter' }"

          def patch(path, fn):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"skip (missing): {path}")
                  return
              src = p.read_text(encoding="utf-8", errors="replace")
              out = fn(src)
              if out != src:
                  p.write_text(out, encoding="utf-8")
                  print(f"patched: {path}")
              else:
                  print(f"no change: {path}")

          # 1) jcenter() has been shut down; route through Maven Central plus a
          #    jcenter mirror that still serves the legacy Android artifacts.
          def fix_jcenter(s):
              s = re.sub(r"^([ \t]*)jcenter\(\)[ \t]*$",
                         lambda m: f"{m.group(1)}mavenCentral()\n{m.group(1)}{ALIYUN}",
                         s, flags=re.M)
              # allprojects blocks already list jcenter once; drop bare duplicates
              s = re.sub(r"(mavenCentral\(\)\n[ \t]*maven \{ url 'https://maven\.aliyun\.com/repository/jcenter' \}\n)([ \t]*mavenCentral\(\))",
                         r"\1", s)
              return s

          patch("build.gradle", fix_jcenter)
          patch("app/build.gradle", fix_jcenter)

          # 2) Signing config points at the vendor's machine, which does not exist
          #    here. Make it conditional so debug builds fall back to the default
          #    debug keystore instead of failing.
          def fix_signing(s):
              m = re.search(
                  r"( *)signingConfigs \{\n( *)config \{\n"
                  r"(?:[^\n]*\n)*?"
                  r" *storeFile file\('([^']+)'\)\n"
                  r"(?:[^\n]*\n)*? *\}\n( *)\}",
                  s)
              if not m:
                  return s
              indent, cfg_indent, store_path, closing = m.group(1), m.group(2), m.group(3), m.group(4)
              key_alias = re.search(r"keyAlias '([^']*)'", m.group(0))
              key_pass = re.search(r"keyPassword '([^']*)'", m.group(0))
              store_pass = re.search(r"storePassword '([^']*)'", m.group(0))
              if not (key_alias and key_pass and store_pass):
                  return s

              win = store_path.replace("\\\\", "\\")
              unix = store_path.replace("\\\\", "/")
              a, c, k = key_alias.group(1), cfg_indent, key_pass.group(1)
              sp = store_pass.group(1)

              block = (
                  f"{indent}def releaseKeystore = file('{win}')\n"
                  f"{indent}signingConfigs {{\n"
                  f"{indent}    if (releaseKeystore.exists() || file('{unix}').exists()) {{\n"
                  f"{indent}        config {{\n"
                  f"{indent}            keyAlias '{a}'\n"
                  f"{indent}            keyPassword '{k}'\n"
                  f"{indent}            storeFile releaseKeystore\n"
                  f"{indent}            storePassword '{sp}'\n"
                  f"{indent}        }}\n"
                  f"{indent}    }}\n"
                  f"{closing}}}"
              )
              s = s[:m.start()] + block + s[m.end():]
              s = s.replace("signingConfig signingConfigs.config",
                            "signingConfig releaseKeystore.exists() ? signingConfigs.config : null")
              return s

          patch("app/build.gradle", fix_signing)

          # 3) Drop repositories that no longer resolve (Splunk Mint is gone,
          #    Fabric's Maven host answers 403) and any dependency only they fed.
          def fix_dead_repos(s):
              s = re.sub(r"[ \t]*maven \{\n[ \t]*url \"https://mint\.splunk\.com/gradle/\"\n[ \t]*\}\n", "", s)
              s = re.sub(r"[ \t]*maven \{ url \"https://maven\.fabric\.io/public\" \}\n", "", s)
              s = re.sub(r"[ \t]*implementation 'com\.splunk\.mint:mint:[^']*'\n", "", s)
              return s

          patch("app/build.gradle", fix_dead_repos)

          # 4) The legacy Crashlytics SDK is not on any live mirror and nothing
          #    imports it; the Firebase Crashlytics plugin covers reporting.
          def fix_legacy_crashlytics(s):
              s = re.sub(r"[ \t]*implementation\('com\.crashlytics\.sdk\.android:crashlytics:[^']*'\) \{\n"
                         r"[ \t]*transitive = true;\n[ \t]*\}\n", "", s)
              return s

          patch("app/build.gradle", fix_legacy_crashlytics)

          # 5) com.trafi:anchor-bottom-sheet-behavior only ever existed on a
          #    dead host; the same artifact builds from GitHub via jitpack.
          def fix_trafi(s):
              s = s.replace("implementation 'com.trafi:anchor-bottom-sheet-behavior:",
                            "implementation 'com.github.trafi:anchor-bottom-sheet-behavior:")
              return s

          patch("app/build.gradle", fix_trafi)
          PY

      - name: Ensure jitpack is reachable for the app module
        run: |
          set -euo pipefail
          if ! grep -q "jitpack.io" app/build.gradle; then
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path("app/build.gradle")
          s = p.read_text(encoding="utf-8", errors="replace")
          s = s.replace("repositories {\n    mavenCentral()",
                        "repositories {\n    mavenCentral()\n\n    maven {\n        url \"https://jitpack.io\"\n    }", 1)
          p.write_text(s, encoding="utf-8")
          print("added jitpack to app/build.gradle")
          PY
          fi

      - name: Extend .gitignore
        run: |
          set -euo pipefail
          cat >> .gitignore <<'EOF'
          /dist/
          app/prod/
          fabric.properties
          .externalNativeBuild/
          .cxx/
          EOF

      - name: Verify the project is coherent
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -x gradlew
          grep -q "include ':app'" settings.gradle
          echo "--- repositories in root build.gradle ---"
          sed -n '/repositories {/,/}/p' build.gradle | head -12
          echo "--- signing in app/build.gradle ---"
          grep -n "releaseKeystore" app/build.gradle | head -6
          echo "--- dead hosts still referenced? ---"
          grep -rn "jcenter()" build.gradle app/build.gradle || echo "none (good)"
          grep -rn "splunk\|maven.fabric.io" build.gradle app/build.gradle || echo "none (good)"

      - name: Commit the fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change."; exit 0
          fi
          git commit -m "ci: restore Gradle wrapper and fix dead repositories for CI"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Summary
        run: |
          {
            echo "### Project prepared"
            echo ""
            echo "- Gradle wrapper restored (was absent from the vendor zip)"
            echo "- \`jcenter()\` replaced with Maven Central + mirror"
            echo "- Release signing made conditional"
            echo "- Dead repositories (Splunk Mint, Fabric) removed"
          } >> "$GITHUB_STEP_SUMMARY"