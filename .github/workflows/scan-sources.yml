name: Scan sources for stale endpoints

# Finds every place the app still points at a domain or host that the opss
# backend replaced. Runs on GitHub because the search covers the whole tree in
# one checkout; nothing is downloaded to a workstation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - '.github/workflows/scan-sources.yml'

permissions:
  contents: read

jobs:
  scan:
    name: Find stale hosts and the runtime wiring
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Look for every hard-coded host
        run: |
          set -uo pipefail
          echo "=== hosts referenced in sources ==="
          grep -rhoE '(https?://)?[a-zA-Z0-9.-]+\.(com|net|org|io|ir)[a-zA-Z0-9/_.-]*' \
            app/src app/build.gradle 2>/dev/null \
            | sed 's#^https\?://##' | cut -d/ -f1 | sort | uniq -c | sort -rn | head -40

      - name: Look for hard-coded IP literals
        run: |
          set -uo pipefail
          echo "=== IP literals in sources ==="
          grep -rnoE 'https?://[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?' \
            app/src app/build.gradle 2>/dev/null | head -30
          echo "(end of list)"
          echo ""
          echo "=== the retired server IP must not appear anywhere ==="
          # The October 2026 migration moved the backend to a new server; the old
          # address no longer answers. A leftover reference here would silently
          # route requests at a dead host, so the scan fails on it.
          if grep -rn '46\.100\.58\.20' app/src app/build.gradle 2>/dev/null; then
            echo "::error::the retired host 46.100.58.20 is still referenced"
            exit 1
          fi
          echo "(clean)"

      - name: Show the lines that mention the vendor domain
        run: |
          set -uo pipefail
          grep -rniE 'alaadcin' app/src app/build.gradle 2>/dev/null | head -40 || echo "(no match)"

      - name: Show how the base URL reaches the code
        run: |
          set -uo pipefail
          echo "=== BuildConfig fields ==="
          grep -nE 'buildConfigField|SERVER_BASE_URL|API_BASE_URL' app/build.gradle | head -20
          echo ""
          echo "=== where the app reads them ==="
          grep -rniE 'SERVER_BASE_URL|API_BASE_URL|BuildConfig\.' app/src --include=*.java --include=*.kt \
            2>/dev/null | head -30 || echo "(no reader found)"

      - name: Find the hard-coded base URL the app really uses
        run: |
          set -uo pipefail
          echo "=== every alaadcin.<tld> reference, with context ==="
          grep -rn 'alaadcin\.' app/src 2>/dev/null | grep -vE 'com\.alaadcin|alaadcin\.user|alaadcin\.driver' | head -30 || echo "(none)"
          echo ""
          echo "=== shared-preference and constant files that hold URLs ==="
          grep -rlniE 'https?://' app/src --include=*.java --include=*.kt 2>/dev/null | head -30
          echo ""
          echo "=== URL_BASE / BASE_URL style constants ==="
          grep -rnE '(URL_BASE|BASE_URL|SERVER_URL|WEB_SERVICE|API_URL)[^A-Za-z]*=' app/src --include=*.java --include=*.kt 2>/dev/null | head -30 || echo "(none)"
          echo ""
          echo "=== the class Retrofit/Volley is built with ==="
          grep -rnE 'new Retrofit|Retrofit\.Builder|baseUrl|WebserviceClient|getRetrofit' app/src --include=*.java --include=*.kt 2>/dev/null | head -20 || echo "(none)"

      - name: Report
        run: |
          {
            echo "### Source scan"
            echo ""
            echo "Full host list, IP literals, the vendor-domain matches and the"
            echo "BuildConfig wiring are in this step's log above."
            echo ""
            echo "The retired host \`46.100.58.20\` must never appear in the sources;"
            echo "if it does, this workflow fails on it."
          } >> "$GITHUB_STEP_SUMMARY"
