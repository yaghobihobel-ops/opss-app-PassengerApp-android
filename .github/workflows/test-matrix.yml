name: Test install across Android versions

# The published APK has to install and start on Android 6 through 14. This
# workflow proves it per API level instead of assuming, because the reasons an
# install is refused are different on each one:
#
#   - below API 21 the app is rejected outright (INSTALL_FAILED_OLDER_SDK)
#   - API 23-25 refuse an app whose native libraries they cannot load
#   - Android 14 refuses APKs whose signing or target level is not acceptable
#
# Each level runs in its own job so one failure does not hide the rest, and the
# exact adb error line is reported verbatim rather than summarised.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-matrix.yml'
      - 'app/build.gradle'
      - 'app/src/main/AndroidManifest.xml'

permissions:
  contents: read
  # Needed to download the APK artifact the Build workflow produced for this
  # commit. Without it the artifact endpoint answers 401 and the resolver
  # silently falls back to the newest release, which is not the commit under
  # test once releases are published on purpose.
  actions: read

concurrency:
  group: opss-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: What is actually inside the APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      min_sdk: ${{ steps.badging.outputs.min_sdk }}
      target_sdk: ${{ steps.badging.outputs.target_sdk }}
      abis: ${{ steps.badging.outputs.abis }}
    steps:
      # Which APK to test, in order of preference:
      #   1. the artifact the Build workflow produced for this exact commit, so
      #      the commit under test is the commit that was built;
      #   2. otherwise the highest published release, which keeps a manual or
      #      scheduled run working when no build artifact exists for the commit.
      # Resolved by one python script because jq is not on every runner image.
      - name: Resolve the APK to test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p dist
          cat > resolve_apk.py <<'PYEOF'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + repo

          def get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=60) as fh:
                  return json.load(fh)

          # 1. the APK the Build workflow produced for this exact commit. The two
          #    workflows are separate runs, so this is found by head_sha rather
          #    than by the current run id. Preferring it means the matrix tests the
          #    commit it was triggered by, not whatever release happens to be
          #    newest now that releases are published on purpose.
          try:
              runs = get(api + "/actions/runs?head_sha=" + sha + "&per_page=100").get("workflow_runs", [])
              build_runs = sorted(
                  (r for r in runs if r.get("name") == "Build and Release" and r.get("conclusion") == "success"),
                  key=lambda r: r["run_number"], reverse=True)
              for r in build_runs:
                  arts = get(api + "/actions/runs/" + str(r["id"]) + "/artifacts?per_page=100").get("artifacts", [])
                  mine = sorted((a for a in arts if a["name"].startswith("opss-")), key=lambda a: a["name"])
                  if not mine:
                      continue
                  art = mine[-1]
                  print("using the build artifact for this commit: " + art["name"], file=sys.stderr)
                  data = urllib.request.urlopen(urllib.request.Request(
                      api + "/actions/artifacts/" + str(art["id"]) + "/zip",
                      headers={"Authorization": "Bearer " + token}), timeout=300).read()
                  open("apk.zip", "wb").write(data)
                  print("artifact-id=" + str(art["id"]))
                  sys.exit(0)
          except Exception as exc:  # noqa: BLE001
              # A missing artifact and an unauthorised one are different: the
              # first is expected on a branch with no build, the second means the
              # job is about to test the wrong commit. Say which one happened.
              msg = str(exc)
              print("no usable build artifact for this commit: " + msg[:200], file=sys.stderr)
              if "401" in msg or "403" in msg or "authenticate" in msg.lower():
                  sys.exit("artifact download was refused (missing actions:read?): " + msg[:300])

          # 2. the highest published release that carries an APK. `/releases/latest`
          #    is the most recently published, not the highest, so a rebuild landing
          #    on an older tag would stay invisible; compare the numeric triple,
          #    because v0.0.9 sorts after v0.0.10 as a string.
          rels = get(api + "/releases?per_page=100")
          if isinstance(rels, dict):
              sys.exit("releases API returned an error: " + json.dumps(rels)[:300])
          best = None
          for r in rels:
              if r.get("draft"):
                  continue
              url = next((a["browser_download_url"] for a in r.get("assets", [])
                          if a["name"].endswith(".apk")), None)
              if not url:
                  continue
              try:
                  key = [int(p) for p in r["tag_name"].lstrip("v").split(".")]
              except (ValueError, KeyError):
                  continue
              if best is None or key > best[0]:
                  best = (key, url)
          if best is None:
              sys.exit("no published release carries an APK")
          print("using the highest release: " + best[1], file=sys.stderr)
          print("url=" + best[1])
          PYEOF
          python3 resolve_apk.py > resolved.txt
          if grep -q '^artifact-id=' resolved.txt; then
            unzip -o -q apk.zip -d unpacked
            APK=$(find unpacked -name '*.apk' | head -1)
            [ -n "$APK" ] || { echo "::error::the artifact carried no APK"; exit 1; }
            cp "$APK" dist/app.apk
          else
            URL=$(sed -n 's/^url=//p' resolved.txt)
            test -n "$URL" || { echo "::error::could not resolve an APK"; exit 1; }
            curl -sSL -o dist/app.apk "$URL"
          fi
          ls -la dist/
          test -s dist/app.apk || { echo "::error::no APK resolved"; exit 1; }

      - name: Read the manifest facts that decide installability
        id: badging
        run: |
          set -uo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          echo "aapt: $AAPT"
          "$AAPT" dump badging dist/app.apk > /tmp/badging.txt

          MIN=$("$AAPT" dump badging dist/app.apk | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
          TARGET=$("$AAPT" dump badging dist/app.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
          ABIS=$(unzip -l dist/app.apk | grep -o 'lib/[a-z0-9_-]*' | cut -d/ -f2 | sort -u | tr '\n' ' ')

          {
            echo "### APK facts"
            echo ""
            echo "- file: \`dist/app.apk\` (${{ steps.get.outputs.size }} bytes)"
            echo "- minSdkVersion: \`$MIN\`"
            echo "- targetSdkVersion: \`$TARGET\`"
            echo "- ABIs packaged: \`$ABIS\`"
            echo ""
            echo "Android 6 is API 23 and Android 14 is API 34, so minSdk must be"
            echo "at most $MIN and the target level must be one Android 14 accepts."
            echo ""
            echo "### Full badging"
            echo '```'
            grep -E "^package|sdkVersion|native-code|uses-feature|uses-permission|application-label:|locales" /tmp/badging.txt | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "--- ABIs packaged, verbatim ---"
          unzip -l dist/app.apk | grep "lib/" | awk -F/ '{print $2}' | sort -u
          echo "--- native libraries ---"
          unzip -l dist/app.apk | grep '\.so$' | awk '{print $1, $4}'
          echo "--- size ---"
          du -h dist/app.apk
          echo "min_sdk=$MIN" >> "$GITHUB_OUTPUT"
          echo "target_sdk=$TARGET" >> "$GITHUB_OUTPUT"
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"

      - name: Show what each Android version would say
        run: |
          set -uo pipefail
          {
            echo ""
            echo "### Requirement per version"
            echo ""
            echo "| Android | API | verdict for this APK |"
            echo "| --- | --- | --- |"
            for pair in "6.0:23" "7.0:24" "8.0:26" "9.0:28" "10:29" "11:30" "12:31" "13:33" "14:34"; do
              NAME=${pair%%:*}
              API=${pair##*:}
              if [ "$API" -lt "${{ steps.badging.outputs.min_sdk }}" ]; then
                VERDICT="rejected: minSdk is ${{ steps.badging.outputs.min_sdk }}, and this version is older"
              else
                VERDICT="eligible to install"
              fi
              echo "| $NAME | $API | $VERDICT |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the facts as an artifact
        run: |
          set -uo pipefail
          {
            echo "minSdkVersion: ${{ steps.badging.outputs.min_sdk }}"
            echo "targetSdkVersion: ${{ steps.badging.outputs.target_sdk }}"
            echo "ABIs: ${{ steps.badging.outputs.abis }}"
            echo ""
            echo "--- full badging ---"
            cat /tmp/badging.txt
          } > "$GITHUB_WORKSPACE/apk-facts.txt"
          cat "$GITHUB_WORKSPACE/apk-facts.txt" | head -20

      - name: Publish the APK for the matrix jobs
        uses: actions/upload-artifact@v4
        with:
          name: matrix-apk
          path: |
            dist/app.apk
            apk-facts.txt
          retention-days: 1
          if-no-files-found: error

  install:
    name: Install on Android ${{ matrix.name }}
    needs: inspect
    runs-on: ubuntu-latest
    # Bounded so a wedged emulator fails in minutes rather than eating the whole
    # budget: the API 23/26/30 jobs previously sat in "Boot ... and install" for
    # the full 75-minute job timeout and were cancelled with no verdict at all.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The arch has to be per level. The 32-bit x86 images are the ones
          # that boot reliably on the old system images; the newer levels only
          # ship a usable 64-bit image. A wrong pairing makes the emulator hang
          # before it ever reports boot_completed.
          - { api: 23, name: '6.0', arch: x86 }
          - { api: 26, name: '8.0', arch: x86 }
          - { api: 30, name: '11', arch: x86_64 }
          - { api: 33, name: '13', arch: x86_64 }
          - { api: 34, name: '14', arch: x86_64 }
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give the runner a usable adb
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            adb kill-server > /dev/null 2>&1 || true
            adb start-server > /dev/null 2>&1 || true
            adb devices > /dev/null 2>&1 && { echo "adb up on attempt $attempt"; break; }
            echo "adb not ready (attempt $attempt)"
            sleep 10
          done

      - name: Enable KVM
        run: |
          set -uo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::warning::no /dev/kvm; this job cannot run an emulator"
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chown root:kvm /dev/kvm 2>/dev/null || true
          sudo chmod 0666 /dev/kvm 2>/dev/null || true

      - name: Install the Qt, GL and X11 stack the emulator needs
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libpulse0 libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libnss3 libxss1 libxrandr2 libxi6 \
            libxcursor1 libxdamage1 libxfixes3 libasound2t64 \
            libqt5gui5 libqt5widgets5 libx11-6 libx11-xcb1 libxext6 \
            libxrender1 libxtst6 || echo "::warning::some packages were unavailable"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb x11-utils \
            || echo "::warning::xvfb could not be installed"
          if ! pgrep -x Xvfb > /dev/null 2>&1; then
            nohup Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
            sleep 5
          fi
          xdpyinfo -display :99 > /dev/null 2>&1 && { echo "DISPLAY=:99" >> "$GITHUB_ENV"; echo "xvfb serving :99"; } \
            || echo "::warning::xvfb did not start"

      - name: Fetch the APK
        uses: actions/download-artifact@v4
        with:
          name: matrix-apk
          path: fetched
          merge-multiple: true

      - name: Put the APK where the emulator step expects it
        run: |
          set -uo pipefail
          mkdir -p dist
          find fetched -name '*.apk' | head -5
          APK=$(find fetched -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK in the artifact"; exit 1; }
          cp "$APK" dist/app.apk
          ls -la dist/
          # State the path the next step will use, because the emulator action
          # cannot read a job output.
          echo "$GITHUB_WORKSPACE/dist/app.apk" > dist/apk-path.txt

      - name: Boot Android ${{ matrix.name }} and install
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # Must match the level: google_apis ships x86 for API 23/26 and only
          # x86_64 from API 30 up. Asking for x86_64 on API 23 has no image, and
          # the emulator then hangs before boot_completed instead of failing, which
          # is why those three jobs burned the full timeout and were cancelled.
          arch: ${{ matrix.arch }}
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none -no-metrics
          # Fail the step instead of sitting on a wedged emulator until the job
          # timeout; the job-level timeout above is the second line of defence.
          emulator-boot-timeout: 600
          script: |
            set -u
            echo "android release: $(adb shell getprop ro.build.version.release 2>/dev/null | tr -d '[:space:]')"
            echo "android sdk: $(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '[:space:]')"

            i=0; while [ $i -lt 60 ]; do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')" = "1" ] && break; i=$((i + 1)); sleep 5; done
            echo "boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')"

            echo "--- install attempt ---"
            ls -la "$GITHUB_WORKSPACE/dist/"
            adb install -r -d "$GITHUB_WORKSPACE/dist/app.apk" > "$GITHUB_WORKSPACE/install.txt" 2>&1
            cat "$GITHUB_WORKSPACE/install.txt"
            grep -qE '^[[:space:]]*Success[[:space:]]*$' "$GITHUB_WORKSPACE/install.txt" && echo "INSTALL=ok" > "$GITHUB_WORKSPACE/verdict.txt" || echo "INSTALL=failed" > "$GITHUB_WORKSPACE/verdict.txt"
            cat "$GITHUB_WORKSPACE/verdict.txt"
            grep -qx "INSTALL=ok" "$GITHUB_WORKSPACE/verdict.txt" || exit 1

            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -1); "$AAPT" dump badging "$GITHUB_WORKSPACE/dist/app.apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" > "$GITHUB_WORKSPACE/pkg.txt"
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -1); "$AAPT" dump badging "$GITHUB_WORKSPACE/dist/app.apk" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" > "$GITHUB_WORKSPACE/act.txt"
            echo "package=$(cat "$GITHUB_WORKSPACE/pkg.txt") activity=$(cat "$GITHUB_WORKSPACE/act.txt")"

            adb logcat -c || true
            # No -W: it blocks until the activity reports drawn, which never happens on a software-rendered emulator, and the step then hangs until the job timeout.
            # `timeout` bounds the launch; the verdict below is the process being alive, not -W.
            timeout 120 adb shell am start -n "$(cat "$GITHUB_WORKSPACE/pkg.txt")/$(cat "$GITHUB_WORKSPACE/act.txt")" > "$GITHUB_WORKSPACE/launch.txt" 2>&1 || true
            cat "$GITHUB_WORKSPACE/launch.txt"

            sleep 40
            adb shell pidof "$(cat "$GITHUB_WORKSPACE/pkg.txt")" > /dev/null 2>&1 && echo "ALIVE=yes" > "$GITHUB_WORKSPACE/alive.txt" || echo "ALIVE=no" > "$GITHUB_WORKSPACE/alive.txt"
            cat "$GITHUB_WORKSPACE/alive.txt"
            adb logcat -d > "$GITHUB_WORKSPACE/logcat.txt" 2>/dev/null
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shot.png" 2>/dev/null

            echo "--- runtime failures ---"
            grep -E "AndroidRuntime|FATAL EXCEPTION|NoClassDefFoundError|NoSuchMethodError|VerifyError|Unable to resolve host" "$GITHUB_WORKSPACE/logcat.txt" 2>/dev/null | head -25
            echo "(end)"

      - name: Report this Android version
        if: always()
        run: |
          set -uo pipefail
          mkdir -p logs
          for f in install.txt verdict.txt alive.txt launch.txt logcat.txt shot.png; do
            cp -f "$GITHUB_WORKSPACE/$f" logs/ 2>/dev/null || true
          done
          OUTCOME="${{ steps.run.outcome }}"
          {
            echo "### Android ${{ matrix.name }} (API ${{ matrix.api }})"
            echo ""
            echo "- emulator step: \`${OUTCOME:-not run}\`"
            echo ""
            echo '```'
            cat logs/verdict.txt 2>/dev/null || echo "(no verdict)"
            echo ""
            cat logs/install.txt 2>/dev/null || echo "(no install output)"
            echo '```'
            if [ -s logs/shot.png ]; then
              echo ""
              echo "The app was running; the screenshot is in this job's artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this version's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-android-${{ matrix.name }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn