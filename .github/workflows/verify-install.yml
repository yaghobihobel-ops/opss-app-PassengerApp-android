name: Verify install on a real device image

# This workflow proves the two things a build log alone cannot:
#   1. the published APK really installs — Android refuses to parse an unsigned
#      or truncated package, which is exactly the install failure we hit
#   2. the app process really starts and stays up
#
# It is separate from build.yml on purpose: the emulator needs KVM, an X
# display and a Qt/GL stack that the build runner does not need. A runner that
# cannot host an emulator must be reported as "not verified", never as a pass.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-install.yml'

permissions:
  contents: read

concurrency:
  group: opss-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, launch and capture the runtime logs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give the runner a usable adb before anything else
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            adb kill-server > /dev/null 2>&1 || true
            adb start-server > /dev/null 2>&1 || true
            if adb devices > /dev/null 2>&1; then
              echo "adb server is up on attempt $attempt"
              break
            fi
            echo "adb not ready (attempt $attempt)"
            sleep 10
          done
          adb version || true

      - name: Report whether this runner can host an emulator
        id: capable
        run: |
          set -uo pipefail
          # Nested virtualisation is not always available. Decide once, up front,
          # so the steps below skip cleanly instead of failing halfway.
          if [ ! -e /dev/kvm ]; then
            echo "KVM=absent" >> "$GITHUB_OUTPUT"
            echo "::warning::no /dev/kvm on this runner; the emulator cannot run here"
            exit 0
          fi
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if sudo chown root:kvm /dev/kvm 2>/dev/null && sudo chmod 0666 /dev/kvm; then
            echo "KVM=ready" >> "$GITHUB_OUTPUT"
          else
            echo "KVM=absent" >> "$GITHUB_OUTPUT"
            echo "::warning::could not open /dev/kvm for this user"
          fi

      - name: Install the emulator runtime packages
        if: steps.capable.outputs.KVM == 'ready'
        run: |
          set -uo pipefail
          # The image does not ship the Qt/GL/X11 stack the emulator links
          # against. Without it the emulator dies at startup with "no Qt platform
          # plugin could be initialized" or "Could not open libX11.so", and
          # nothing downstream can ever run.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libpulse0 libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libnss3 libxss1 libxrandr2 libxi6 \
            libxcursor1 libxdamage1 libxfixes3 libasound2t64 \
            libqt5gui5 libqt5widgets5 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxtst6 \
            || echo "::warning::some emulator packages were unavailable"

          # xvfb and xdpyinfo sit outside that list; install them on their own
          # so a failure above cannot take the display with it.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb x11-utils \
            || echo "::warning::xvfb could not be installed"

          echo "--- what actually landed ---"
          for p in libqt5gui5 libx11-6 xvfb x11-utils; do
            dpkg -s "$p" > /dev/null 2>&1 && echo "have $p" || echo "MISSING $p"
          done

          # The emulator is a Qt application and needs a display server. The
          # action starts its own xvfb, but DISPLAY does not always reach the
          # process it launches, so start one here and export it explicitly.
          if ! pgrep -x Xvfb > /dev/null 2>&1; then
            nohup Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
            sleep 5
          fi
          if xdpyinfo -display :99 > /dev/null 2>&1; then
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
            echo "xvfb is serving :99"
          else
            echo "::warning::xvfb did not start; the emulator will have no display"
            tail -20 /tmp/xvfb.log 2>/dev/null || true
          fi

      - name: Install, launch and capture the logs
        id: run
        if: steps.capable.outputs.KVM == 'ready'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 rather than 29: the API 29 google_apis image fails to reach
          # sys.boot_completed on current runner images.
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          # No -no-window: it makes the emulator exit on runners without a
          # display, and the action already runs it headless under xvfb.
          # -gpu swiftshader is the software renderer current builds support.
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none -no-metrics
          # The default 600s is not always enough for a cold image on a busy
          # runner; without this the step fails on the boot timeout alone.
          emulator-boot-timeout: 900
          script: |
            # This action feeds `script` to `/usr/bin/sh` one line at a time, so
                        # every construct here stays on one line. A multi-line `while` or
                        # `if` gets truncated to its first line and dash then fails with
                        # "Syntax error: end of file unexpected (expecting done)".
                        # It also means `set -o pipefail` is unavailable, so verdicts are
                        # read from the output text rather than from an exit status.
                        set -u

                        # Fetch the APK from the public release rather than receiving a path.
                        # The emulator action evaluates its `with:` block before this job's
                        # step outputs exist, and it runs `script` from a working directory
                        # where a file staged in an earlier step is not visible. The
                        # repository is public, so this needs no token.
                        REPO="${{ github.repository }}"
                        URL=$(curl -sSL "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' 2>/dev/null | head -1)
                        echo "release url: ${URL:-none}"
                        APK="$GITHUB_WORKSPACE/apk-for-emulator.apk"
                        [ -n "$URL" ] && curl -sSL -o "$APK" "$URL"
                        echo "APK: ${APK:-none}"
                        test -s "$APK" && echo "APK size: $(du -h "$APK" | cut -f1)" || { echo "APK_MISSING=1" > install-verdict.txt; exit 1; }

                        adb wait-for-device
                        echo "device android=$(adb shell getprop ro.build.version.release 2>/dev/null | tr -d '[:space:]')"

                        # boot_completed is 1 only once the package manager is really serving.
                        # Installing before that returns an empty error, which is impossible
                        # to tell apart from a package Android refuses.
                        echo "waiting for the package manager..."
                        BOOTED=""; i=0; while [ $i -lt 60 ]; do BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]'); [ "$BOOTED" = "1" ] && break; i=$((i + 1)); sleep 5; done
                        echo "boot_completed=${BOOTED:-empty} after $((i * 5))s"
                        [ "$BOOTED" = "1" ] || { echo "NOT_READY=1" > install-verdict.txt; exit 1; }

                        echo "--- install ---"
                        adb install -r -d "$APK" > install-result.txt 2>&1
                        cat install-result.txt
                        grep -qE '^Success$' install-result.txt && echo "INSTALL=ok" > install-verdict.txt || echo "INSTALL=failed" > install-verdict.txt
                        cat install-verdict.txt
                        grep -qx "INSTALL=ok" install-verdict.txt || exit 1

                        AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -1)
                        PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
                        ACT=$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")
                        echo "$PKG" > package.txt
                        echo "package=$PKG launchable=${ACT:-none}"

                        echo "--- is the package really installed? ---"
                        adb shell pm list packages 2>/dev/null | grep -F "$PKG" > /dev/null && echo "PACKAGE_PRESENT=yes" || echo "PACKAGE_PRESENT=no"

                        adb logcat -c
                        [ -n "$ACT" ] && adb shell am start -W -n "$PKG/$ACT" > launch-result.txt 2>&1 || adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > launch-result.txt 2>&1
                        cat launch-result.txt

                        sleep 45

                        echo "--- process state ---"
                        adb shell pidof "$PKG" > /dev/null 2>&1 && echo "ALIVE=yes" || echo "ALIVE=no"

                        adb logcat -d > runtime-logcat.txt 2>/dev/null
                        adb exec-out screencap -p > runtime-screenshot.png 2>/dev/null
                        ls -la runtime-logcat.txt runtime-screenshot.png 2>/dev/null

                        echo "--- crashes in this package ---"
                        grep "FATAL EXCEPTION" runtime-logcat.txt 2>/dev/null | grep -q "$PKG" && echo "APP_CRASH=yes" || echo "APP_CRASH=no"
                        grep -A15 "FATAL EXCEPTION" runtime-logcat.txt 2>/dev/null | head -40

                        echo "--- backend and network ---"
                        grep -iE "alaadcin|opss|taxi\.ecardo\.ir|UnknownHost|SSLHandshake|Firebase|Maps API key|Authorization failure" runtime-logcat.txt 2>/dev/null | tail -40
                        echo "(end of app lines)"

      - name: Summarise the real outcome
        if: always()
        run: |
          set -uo pipefail
          mkdir -p logs
          for f in runtime-logcat.txt install-result.txt install-verdict.txt launch-result.txt package.txt runtime-screenshot.png; do
            cp -f "$f" logs/ 2>/dev/null || true
          done

          KVM="${{ steps.capable.outputs.KVM }}"
          OUTCOME="${{ steps.run.outcome }}"

          {
            echo "### Install verification"
            echo ""
            echo "- KVM on this runner: \`${KVM:-not checked}\`"
            echo "- Emulator step outcome: \`${OUTCOME:-not run}\`"
            echo ""
            echo "### Install output"
            echo ""
            echo '```'
            cat logs/install-result.txt 2>/dev/null || echo "(no install output was captured)"
            echo '```'
            echo ""
            if grep -qx "INSTALL=ok" logs/install-verdict.txt 2>/dev/null; then
              echo "**The package installed.** Android accepted the APK, which is the"
              echo "thing that was failing with \`there was a problem while parsing the package\`."
            else
              echo "**NOT VERIFIED**: there is no \`INSTALL=ok\` verdict in this run, so the"
              echo "package was never observed installing."
            fi
            echo ""
            if [ -s logs/runtime-screenshot.png ]; then
              echo "A screenshot of the running app is attached as an artifact."
            else
              echo "No screenshot was captured, so the app was never observed running."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-evidence-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn