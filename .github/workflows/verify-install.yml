name: Verify install on a real device image

# This workflow proves the two things a build log alone cannot:
#   1. the published APK really installs — Android refuses to parse an unsigned
#      or truncated package, which is exactly the install failure we hit
#   2. the app process really starts and stays up
#
# It is separate from build.yml on purpose: the emulator needs KVM, an X
# display and a Qt/GL stack that the build runner does not need. A runner that
# cannot host an emulator must be reported as "not verified", never as a pass.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-install.yml'

permissions:
  contents: read

concurrency:
  group: opss-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, launch and capture the runtime logs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give the runner a usable adb before anything else
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            adb kill-server > /dev/null 2>&1 || true
            adb start-server > /dev/null 2>&1 || true
            if adb devices > /dev/null 2>&1; then
              echo "adb server is up on attempt $attempt"
              break
            fi
            echo "adb not ready (attempt $attempt)"
            sleep 10
          done
          adb version || true

      - name: Report whether this runner can host an emulator
        id: capable
        run: |
          set -uo pipefail
          # Nested virtualisation is not always available. Decide once, up front,
          # so the steps below skip cleanly instead of failing halfway.
          if [ ! -e /dev/kvm ]; then
            echo "KVM=absent" >> "$GITHUB_OUTPUT"
            echo "::warning::no /dev/kvm on this runner; the emulator cannot run here"
            exit 0
          fi
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if sudo chown root:kvm /dev/kvm 2>/dev/null && sudo chmod 0666 /dev/kvm; then
            echo "KVM=ready" >> "$GITHUB_OUTPUT"
          else
            echo "KVM=absent" >> "$GITHUB_OUTPUT"
            echo "::warning::could not open /dev/kvm for this user"
          fi

      - name: Install the emulator runtime packages
        if: steps.capable.outputs.KVM == 'ready'
        run: |
          set -uo pipefail
          # The image does not ship the Qt/GL/X11 stack the emulator links
          # against. Without it the emulator dies at startup with "no Qt platform
          # plugin could be initialized" or "Could not open libX11.so", and
          # nothing downstream can ever run.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libpulse0 libgl1-mesa-dri libglx-mesa0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libnss3 libxss1 libxrandr2 libxi6 \
            libxcursor1 libxdamage1 libxfixes3 libasound2t64 \
            libqt5gui5 libqt5widgets5 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxtst6 \
            || echo "::warning::some emulator packages were unavailable"

          # xvfb and xdpyinfo sit outside that list; install them on their own
          # so a failure above cannot take the display with it.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb x11-utils \
            || echo "::warning::xvfb could not be installed"

          echo "--- what actually landed ---"
          for p in libqt5gui5 libx11-6 xvfb x11-utils; do
            dpkg -s "$p" > /dev/null 2>&1 && echo "have $p" || echo "MISSING $p"
          done

          # The emulator is a Qt application and needs a display server. The
          # action starts its own xvfb, but DISPLAY does not always reach the
          # process it launches, so start one here and export it explicitly.
          if ! pgrep -x Xvfb > /dev/null 2>&1; then
            nohup Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
            sleep 5
          fi
          if xdpyinfo -display :99 > /dev/null 2>&1; then
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
            echo "xvfb is serving :99"
          else
            echo "::warning::xvfb did not start; the emulator will have no display"
            tail -20 /tmp/xvfb.log 2>/dev/null || true
          fi

      - name: Resolve which release to test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" -o releases.json
          cat > resolve_apk.py <<'PYEOF'
          import json
          import sys

          # Choose the highest released version that actually carries an APK.
          #
          # `/releases/latest` returns the most recently published release, not the
          # highest version, so a rebuild landing on an older tag stays invisible to every
          # workflow that downloads from it. Compare the numeric triple rather than the
          # tag string, because v0.0.9 sorts after v0.0.10 alphabetically.
          #
          # Exits non-zero on an API error or when nothing is published, so an empty URL
          # is never mistaken for "no releases". Parsed with python because jq is not
          # installed on every runner image.
          with open("releases.json", encoding="utf-8") as fh:
              rels = json.load(fh)

          if isinstance(rels, dict):
              sys.exit("releases API returned an error: " + json.dumps(rels)[:300])

          best = None
          for r in rels:
              if r.get("draft"):
                  continue
              url = next(
                  (a["browser_download_url"] for a in r.get("assets", []) if a["name"].endswith(".apk")),
                  None,
              )
              if not url:
                  continue
              try:
                  key = [int(part) for part in r["tag_name"].lstrip("v").split(".")]
              except (ValueError, KeyError):
                  continue
              if best is None or key > best[0]:
                  best = (key, url)

          if best is None:
              sys.exit("no published release carries an APK")

          print(best[1])
          PYEOF
          python3 resolve_apk.py > "$GITHUB_WORKSPACE/apk-url.txt"
          echo "testing: $(cat "$GITHUB_WORKSPACE/apk-url.txt" 2>/dev/null || echo none)"
          test -s "$GITHUB_WORKSPACE/apk-url.txt" || { echo "::error::could not resolve a release URL"; exit 1; }
      - name: Install, launch and capture the logs
        id: run
        if: steps.capable.outputs.KVM == 'ready'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 30 rather than 29: the API 29 google_apis image fails to reach
          # sys.boot_completed on current runner images.
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          # No -no-window: it makes the emulator exit on runners without a
          # display, and the action already runs it headless under xvfb.
          # -gpu swiftshader is the software renderer current builds support.
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -camera-back none -no-metrics
          # The default 600s is not always enough for a cold image on a busy
          # runner; without this the step fails on the boot timeout alone.
          emulator-boot-timeout: 900
          script: |
            # This action feeds `script` to `/usr/bin/sh` one line at a time. Two
                        # consequences, both learned the hard way:
                        #   1. a multi-line `while` or `if` is truncated to its first line
                        #      and dash then fails with a syntax error, so every construct
                        #      here stays on one line;
                        #   2. each line is a separate `sh -c`, so no variable survives to
                        #      the next line. Anything a later line needs is recomputed, or
                        #      written to a file under $GITHUB_WORKSPACE and read back.
                        # `set -o pipefail` is likewise unavailable, so verdicts are read
                        # from output text rather than from an exit status.
                        set -u

                        # Fetch the APK from the public release. The repository is public, so
                        # no token is needed, and the URL is inlined because a variable set
                        # on an earlier line would be empty here.
                        echo "release url: $(cat "$GITHUB_WORKSPACE/apk-url.txt")"
                        curl -sSL -o "$GITHUB_WORKSPACE/apk.apk" "$(cat "$GITHUB_WORKSPACE/apk-url.txt")"
                        ls -la "$GITHUB_WORKSPACE/apk.apk"
                        test -s "$GITHUB_WORKSPACE/apk.apk" && echo "APK_DOWNLOADED=yes" || { echo "APK_MISSING=1" > "$GITHUB_WORKSPACE/install-verdict.txt"; exit 1; }

                        adb wait-for-device
                        echo "device android=$(adb shell getprop ro.build.version.release 2>/dev/null | tr -d '[:space:]')"

                        # The action reports the device booted before the package manager is
                        # actually serving. Installing in that window returns an empty error
                        # that looks exactly like a package Android refuses, so poll until
                        # boot_completed really reads 1.
                        i=0; while [ $i -lt 60 ]; do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')" = "1" ] && break; i=$((i + 1)); sleep 5; done
                        echo "boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]') after $((i * 5))s"
                        [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')" = "1" ] || { echo "NOT_READY=1" > "$GITHUB_WORKSPACE/install-verdict.txt"; exit 1; }

                        echo "--- install ---"
                        adb install -r -d "$GITHUB_WORKSPACE/apk.apk" > "$GITHUB_WORKSPACE/install-result.txt" 2>&1
                        cat "$GITHUB_WORKSPACE/install-result.txt"
                        grep -qE '^Success$' "$GITHUB_WORKSPACE/install-result.txt" && echo "INSTALL=ok" > "$GITHUB_WORKSPACE/install-verdict.txt" || echo "INSTALL=failed" > "$GITHUB_WORKSPACE/install-verdict.txt"
                        cat "$GITHUB_WORKSPACE/install-verdict.txt"
                        grep -qx "INSTALL=ok" "$GITHUB_WORKSPACE/install-verdict.txt" || exit 1

                        # Record the package name and launcher activity so later lines do not
                        # have to parse the badging output again.
                        AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -1); "$AAPT" dump badging "$GITHUB_WORKSPACE/apk.apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" > "$GITHUB_WORKSPACE/package.txt"
                        AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -1); "$AAPT" dump badging "$GITHUB_WORKSPACE/apk.apk" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" > "$GITHUB_WORKSPACE/activity.txt"
                        echo "package=$(cat "$GITHUB_WORKSPACE/package.txt") launchable=$(cat "$GITHUB_WORKSPACE/activity.txt")"

                        echo "--- is the package really installed? ---"
                        adb shell pm list packages 2>/dev/null | grep -F "$(cat "$GITHUB_WORKSPACE/package.txt")" > /dev/null && echo "PACKAGE_PRESENT=yes" || echo "PACKAGE_PRESENT=no"

                        adb logcat -c || true
                        adb shell am start -W -n "$(cat "$GITHUB_WORKSPACE/package.txt")/$(cat "$GITHUB_WORKSPACE/activity.txt")" > "$GITHUB_WORKSPACE/launch-result.txt" 2>&1
                        cat "$GITHUB_WORKSPACE/launch-result.txt"

                        sleep 45

                        echo "--- process state ---"
                        adb shell pidof "$(cat "$GITHUB_WORKSPACE/package.txt")" > /dev/null 2>&1 && echo "ALIVE=yes" || echo "ALIVE=no"

                        adb logcat -d > "$GITHUB_WORKSPACE/runtime-logcat.txt" 2>/dev/null
                        adb exec-out screencap -p > "$GITHUB_WORKSPACE/runtime-screenshot.png" 2>/dev/null
                        ls -la "$GITHUB_WORKSPACE/runtime-logcat.txt" "$GITHUB_WORKSPACE/runtime-screenshot.png" 2>/dev/null

                        echo "--- crashes in this package ---"
                        grep "FATAL EXCEPTION" "$GITHUB_WORKSPACE/runtime-logcat.txt" 2>/dev/null | grep -q "$(cat "$GITHUB_WORKSPACE/package.txt")" && echo "APP_CRASH=yes" || echo "APP_CRASH=no"
                        grep -A15 "FATAL EXCEPTION" "$GITHUB_WORKSPACE/runtime-logcat.txt" 2>/dev/null | head -40

                        echo "--- backend and network ---"
                        grep -iE "alaadcin|opss|taxi\.ecardo\.ir|UnknownHost|SSLHandshake|Firebase|Maps API key|Authorization failure" "$GITHUB_WORKSPACE/runtime-logcat.txt" 2>/dev/null | tail -40
                        echo "(end of app lines)"

      - name: Summarise the real outcome
        if: always()
        run: |
          set -uo pipefail
          # The emulator script writes its evidence under $GITHUB_WORKSPACE.
          mkdir -p logs
          for f in runtime-logcat.txt install-result.txt install-verdict.txt launch-result.txt package.txt runtime-screenshot.png; do
            cp -f "$GITHUB_WORKSPACE/$f" logs/ 2>/dev/null || true
          done

          KVM="${{ steps.capable.outputs.KVM }}"
          OUTCOME="${{ steps.run.outcome }}"

          {
            echo "### Install verification"
            echo ""
            echo "- KVM on this runner: \`${KVM:-not checked}\`"
            echo "- Emulator step outcome: \`${OUTCOME:-not run}\`"
            echo ""
            echo "### Install output"
            echo ""
            echo '```'
            cat logs/install-result.txt 2>/dev/null || echo "(no install output was captured)"
            echo '```'
            echo ""
            if grep -qx "INSTALL=ok" logs/install-verdict.txt 2>/dev/null; then
              echo "**The package installed.** Android accepted the APK, which is the"
              echo "thing that was failing with \`there was a problem while parsing the package\`."
            else
              echo "**NOT VERIFIED**: there is no \`INSTALL=ok\` verdict in this run, so the"
              echo "package was never observed installing."
            fi
            echo ""
            if [ -s logs/runtime-screenshot.png ]; then
              echo "A screenshot of the running app is attached as an artifact."
            else
              echo "No screenshot was captured, so the app was never observed running."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-evidence-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn