apply plugin: 'com.android.application'
apply plugin: 'realm-android'
apply plugin: 'com.google.firebase.crashlytics'


// Override from the CLI: ./gradlew assembleProdDebug -PSERVER_BASE_URL=https://host/
ext.SERVER_BASE_URL = project.findProperty('SERVER_BASE_URL')

android {
    configurations {
        all*.exclude group: 'com.squareup.okhttp', module: 'okhttp'
        // Legacy support-library transitives collide with AndroidX.
        all*.exclude group: 'com.android.support'
    }

    // The vendor keystore lives on a Windows machine that is not present
    // here, and file() on a Windows path throws URISyntaxException on the
    // Linux runner. Probe portably and fall back to the Android debug key.
    def releaseKeystoreFile = {
        def win = new File('C:/Users/sitw2/Documents/okboz.jks')
        def nix = new File('/opt/opss/okboz.jks')
        if (win.exists()) return win
        if (nix.exists()) return nix
        return null
    }()
    signingConfigs {
        if (releaseKeystoreFile != null) {
            config {
                keyAlias 'okboz.com'
                keyPassword 'okboz.com'
                storeFile releaseKeystoreFile
                storePassword 'okboz.com'
            }
        }
    }
    compileOptions {
        sourceCompatibility "1.8"
        targetCompatibility "1.8"
    }
    compileSdkVersion 31
    buildToolsVersion '31.0.0'
    defaultConfig {
        applicationId "com.alaadcin.user"
        minSdkVersion 17
        targetSdkVersion 31
        versionCode 68
        versionName "0.0.33"
        // Single source of truth for the backend address. Override per build
        // with -PSERVER_BASE_URL=https://host/ on the command line.
        buildConfigField "String", "SERVER_BASE_URL", "\"" + (SERVER_BASE_URL ?: "https://taxi.ecardo.ir/") + "\""
        buildConfigField "String", "API_BASE_URL", "\"" + (SERVER_BASE_URL ?: "https://taxi.ecardo.ir/") + "webservice_shark.php\""
        multiDexEnabled true
        /*
         * Every ABI the project must install on, Android 6 through 14.
         *
         * Filtering down to just armeabi-v7a and arm64-v8a was the reason
         * `adb install` refused the APK with INSTALL_FAILED_NO_MATCHING_ABIS:
         * Android refuses any package whose native libraries do not include the
         * device's ABI, and a phone reporting `armeabi` or `x86` had nothing to
         * load. The vendored aars ship libs for all six folders, so keeping them
         * all costs disk but makes the package installable everywhere.
         *
         *   armeabi      Android 4.4-6 era 32-bit devices
         *   armeabi-v7a  Android 5-13, the common 32-bit phone ABI
         *   arm64-v8a    Android 5-14, every modern phone
         *   x86          emulators and a few tablets
         *   x86_64       emulators and Chromebooks
         *
         * armeabi-v7a and arm64-v8a are the two that real phones use; the rest
         * exist so no device is told "no matching ABI".
         */
        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        vectorDrawables.useSupportLibrary = true
        // would otherwise be packaged as well.
        javaCompileOptions {
            annotationProcessorOptions {
                includeCompileClasspath true
            }
        }
        renderscriptTargetApi 28
        renderscriptSupportModeEnabled true
    ndkVersion '22.0.7026061'
    }
    flavorDimensions "default"
    dexOptions {
        jumboMode true
    }
    productFlavors {
        dev {
            // dev utilizes minSDKVersion = 21 to allow the Android gradle plugin
            // to pre-dex each module and produce an APK that can be tested on
            // Android Lollipop without time consuming dex merging processes.
            minSdkVersion 17
        }
        prod {
            // The actual minSdkVersion for the application.
            minSdkVersion 17
        }
    }
    dexOptions {
        javaMaxHeapSize "4g"
    }
    buildTypes {
        release {
            signingConfig releaseKeystoreFile != null ? signingConfigs.config : signingConfigs.debug
            debuggable false
            buildConfigField "String", "USER_TYPE", "\"Passenger\""
            buildConfigField "String", "USER_ID_KEY", "\"iUserId\""
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            buildConfigField "String", "USER_TYPE", "\"Passenger\""
            buildConfigField "String", "USER_ID_KEY", "\"iUserId\""
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'lib/arm64-v8a/libcardioDecider.so'
        exclude 'lib/arm64-v8a/libcardioRecognizer.so'
        exclude 'lib/arm64-v8a/libcardioRecognizer_tegra2.so'
        exclude 'lib/arm64-v8a/libopencv_core.so'
        exclude 'lib/arm64-v8a/libopencv_imgproc.so'
        exclude 'lib/armeabi/libcardioDecider.so'
        exclude 'lib/armeabi-v7a/libcardioDecider.so'
        exclude 'lib/armeabi-v7a/libcardioRecognizer.so'
        exclude 'lib/armeabi-v7a/libcardioRecognizer_tegra2.so'
        exclude 'lib/armeabi-v7a/libopencv_core.so'
        exclude 'lib/armeabi-v7a/libopencv_imgproc.so'
        exclude 'lib/mips/libcardioDecider.so'
        exclude 'lib/x86/libcardioDecider.so'
        exclude 'lib/x86/libcardioRecognizer.so'
        exclude 'lib/x86/libcardioRecognizer_tegra2.so'
        exclude 'lib/x86/libopencv_core.so'
        exclude 'lib/x86/libopencv_imgproc.so'
        exclude 'lib/x86_64/libcardioDecider.so'
        exclude 'lib/x86_64/libcardioRecognizer.so'
        exclude 'lib/x86_64/libcardioRecognizer_tegra2.so'
        exclude 'lib/x86_64/libopencv_core.so'
        exclude 'lib/x86_64/libopencv_imgproc.so'

        // exclude 'META-INF/NOTICE' // will not include NOTICE file
        // exclude 'META-INF/LICENSE' // will not include LICENSE file
        //exclude 'META-INF/notice'
        // exclude 'META-INF/notice.txt'
        // exclude 'META-INF/license'
        // exclude 'META-INF/license.txt'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}
repositories {
    mavenCentral()



    maven {
        url "https://jitpack.io"

    }
}
dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.github.sharish:ShimmerRecyclerView:v1.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    testImplementation 'junit:junit:4.12'

    /* Customize PubNub Library and OKHttp*/
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.squareup.okio:okio:1.15.0'
    implementation 'javax.annotation:javax.annotation-api:1.2'
    /*
     * app/libs/projectlibfile.aar bundles okhttp 3.8.1 inside its classes.jar,
     * confirmed by okhttp3.internal.Version, whose userAgent string is
     * "okhttp/3.8.1". Two problems came from that:
     *
     *   - keeping only the bundled copy: Firebase Crashlytics calls
     *     OkHttpClient$Builder.callTimeout, added in 3.12, so it threw
     *     NoSuchMethodError on a background thread at startup;
     *   - adding okhttp from Maven: the bundled classes are still on the
     *     classpath, so checkProdDebugDuplicateClasses failed on every
     *     okhttp3.* class.
     *
     * The pinned version wins because Gradle resolves a fileTree entry and a
     * Maven entry into one classpath, and the aar is packaged as an aar rather
     * than exploded into classes.jar at compile time.
     */
    implementation('com.squareup.okhttp3:okhttp:3.12.13') {
        // 3.12.13 is the last 3.x release and pairs with okio 1.15 above.
        transitive = true
    }
    /* Customize PubNub Library and OKHttp*/

    /* RetroFit related libraries*/
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit:converter-gson:2.0.0-beta1'
    /* RetroFit related libraries*/

    /* Android support libraries */
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.browser:browser:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.0.0'
    /* Android support libraries */

    /* Google services related libraries */
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'com.google.android.gms:play-services-places:17.0.0'
    implementation 'com.google.android.gms:play-services-auth:17.0.0'
    implementation 'com.google.maps.android:android-maps-utils:0.5'
    implementation 'com.google.firebase:firebase-database:19.3.1'
    implementation 'com.firebase:firebase-jobdispatcher:0.8.5'
    implementation 'com.google.firebase:firebase-messaging:20.2.4'
    // Recommended: Add the Firebase SDK for Google Analytics.
    implementation 'com.google.firebase:firebase-analytics:17.4.4'
    implementation 'com.google.firebase:firebase-auth:21.0.1'

    // Add the Firebase Crashlytics SDK.
    implementation 'com.google.firebase:firebase-crashlytics:17.1.1'

    /* Google services related libraries */

    //implementation 'com.facebook.android:facebook-android-sdk:4.18.0'
    implementation 'com.facebook.android:facebook-login:5.13.0'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.stripe:stripe-android:8.0.0'

    //implementation 'com.stripe:stripe-android:2.1.0'


    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.jakewharton.picasso:picasso2-okhttp3-downloader:1.1.0'
    implementation 'com.braintreepayments.api:braintree:2.18.1'

    implementation 'com.braintreepayments.api:drop-in:3.7.1'

    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'

    implementation('com.twitter.sdk.android:twitter:3.3.0@aar') {
        transitive = true;
    }

    implementation 'org.apache.commons:commons-lang3:3.6'

    implementation 'com.skyfishjy.ripplebackground:library:1.0.1'

    /*Deliver all*/
    implementation 'com.kyleduo.switchbutton:library:1.4.1'

    implementation 'com.bignerdranch.android:expandablerecyclerview:1.0.3'
    /*Deliver all*/

    implementation 'io.card:android-sdk:5.+'

   // implementation 'com.braintreepayments.api:braintree:2.18.1'

   // implementation 'com.braintreepayments.api:drop-in:3.7.1'


    implementation 'com.paymaya:sdk-android:0.8.0'

    implementation 'co.omise:omise-android:2.6.5'
    implementation 'org.apache.commons:commons-lang3:3.6'
    //String letter capitalize by word character or sentence
    implementation 'com.xendit:xendit-android:1.1.0'

    implementation 'com.neovisionaries:nv-websocket-client:2.12'
    implementation('io.github.sac:SocketclusterClientJava:2.0.0') {
        exclude group: 'org.json', module: 'json'
    }




    implementation 'com.github.jd-alexander:LikeButton:0.2.3'
    implementation 'com.github.livechat:chat-window-android:v2.0.3'
    implementation 'org.joda:joda-convert:1.3.1'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'


    implementation 'com.github.armcha:ColoredShadowImageView:1.1.0'
    implementation 'com.lijiankun24:shadowlayout:1.1.0'
    implementation 'com.github.ViksaaSkool:AutoFitEditText:53238e2d29'
    implementation 'uk.co.samuelwall:material-tap-target-prompt:2.15.0'
    implementation 'com.github.mukeshsolanki:android-otpview-pinview:2.0.3'
    implementation 'com.github.andremion:counterfab:1.2.0'
    implementation 'com.github.Flutterwave:rave-android:1.0.48'
    implementation 'com.google.android:flexbox:2.0.1'
    implementation 'com.ethanhua:skeleton:1.1.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'com.shuhart.stepview:stepview:1.5.1'
    implementation 'com.stepstone.stepper:material-stepper:4.3.1'
    implementation 'com.github.baoyachi:StepView:1.9'

}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-android'
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.6.0'
        force 'androidx.appcompat:appcompat:1.0.0'
        force 'androidx.core:core:1.0.0'
        force 'androidx.fragment:fragment:1.0.0'
        force 'androidx.versionedparcelable:versionedparcelable:1.0.0'
    }
}